name: Tests

# Testing Strategy:
# - Tests run on Linux, macOS, and Windows (cross-platform library)
# - HDF5 is a cross-platform file format - must work everywhere
# - Go 1.26+ required (matches go.mod requirement)
#
# Branch Strategy (GitHub Flow):
# - feature/** branches: Development work
# - fix/** branches: Bug fixes
# - release/** branches: Pre-release testing
# - main branch: Production-ready code only (protected)
# - Pull requests: Must pass all tests before merge (--squash)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Unit tests - Cross-platform
  unit-tests:
    name: Unit Tests - ${{ matrix.os }} - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']  # Match go.mod requirement

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet ./...

    - name: Run unit tests with race detector
      shell: bash
      run: go test -short -v -race -coverprofile=coverage.txt -covermode=atomic ./...


  # C-library interop - Go-written files validated with official HDF5 tools
  c-interop:
    name: C Library Interop
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true

    - name: Install HDF5 tools
      run: sudo apt-get update && sudo apt-get install -y hdf5-tools

    - name: Run C interop tests
      run: go test -v -run TestCInterop .

  # Short fuzz pass over the untrusted-input read surface
  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true

    - name: Fuzz FuzzRead
      run: go test -run '^$' -fuzz FuzzRead -fuzztime 90s .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: false  # Strict for production library

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  # Formatting check
  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo ""
          echo "Run 'go fmt ./...' to fix formatting issues."
          exit 1
        fi
        echo "All files are properly formatted ✓"
