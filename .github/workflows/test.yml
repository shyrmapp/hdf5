name: Tests

# HDF5 is a cross-platform file format, so the unit tests run on Linux, macOS
# and Windows. The interop, fuzz and lint jobs are platform-independent and
# run on Linux only.
#
# The Go version comes from go.mod (go-version-file) so it cannot drift.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet ./...

    - name: Run unit tests with race detector
      shell: bash
      run: go test -race ./...

  # C-library interop - Go-written files validated with official HDF5 tools
  c-interop:
    name: C Library Interop
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Install HDF5 tools
      run: sudo apt-get update && sudo apt-get install -y hdf5-tools

    - name: Run C interop tests
      run: go test -v -run TestCInterop .

  # Short fuzz pass over the untrusted-input read surface
  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Fuzz FuzzRead
      run: go test -run '^$' -fuzz FuzzRead -fuzztime 90s .

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    # golangci-lint does not gate formatting: its formatters only run under
    # `golangci-lint fmt`, which prints a diff but always exits 0.
    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo "Run 'gofmt -w -s .' to fix."
          exit 1
        fi
        echo "All files are properly formatted"

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2  # pinned: `latest` lets a linter release turn main red with no commit
        args: --timeout=5m
